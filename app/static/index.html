<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c2721">
  <title>Cchong 水印</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">C</span><span>Cchong 水印</span></div><span class="local-label">PRIVATE PHOTO STUDIO</span></header>
  <main class="workspace">
    <div class="workspace-grid">
      <div>
        <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="选择照片或拖入照片">
          <input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif,.jpg,.jpeg,.png,.webp,.heic,.heif,.avif" multiple hidden>
          <div class="plus">+</div><strong>选择照片</strong><span>支持多选，也可以把照片拖到这里</span>
        </div>
        <section class="preview-panel" aria-label="水印效果预览">
          <div class="preview-head"><strong>实时预览</strong><span id="preview-name">选择照片后显示</span></div>
          <div class="preview-stage" id="preview-stage"><span id="preview-placeholder">选择照片后显示水印效果</span><img id="preview-image" alt="水印预览" hidden><video id="motion-video" playsinline muted loop controls hidden></video><img id="motion-overlay" alt="动态照片水印" hidden></div>
          <div class="preview-actions"><button id="compare" type="button" disabled>按住查看原图</button><button id="motion-play" type="button" hidden>播放动态照片</button></div>
          <small>点选照片切换预览；拖动预览图可定位水印。</small>
        </section>
      </div>
      <div class="settings">
        <div class="settings-head"><h2>水印设置</h2><button id="reset" class="text-btn" type="button">恢复默认</button></div>
        <div class="scope-switch"><button id="scope-all" type="button" class="active">整批设置</button><button id="scope-one" type="button">当前照片</button></div>
        <p id="scope-note" class="scope-note">调整后应用到整批照片</p>
        <fieldset><legend>颜色</legend><label><input type="radio" name="color" value="auto" checked><span>自动</span></label><label><input type="radio" name="color" value="white"><span>白色</span></label><label><input type="radio" name="color" value="black"><span>黑色</span></label></fieldset>
        <div id="controls"></div>
      </div>
    </div>
    <div class="queue-head"><h2>待处理 <span id="count">0</span></h2><button id="clear" class="text-btn" type="button" disabled>清空</button></div>
    <div id="empty" class="empty">还没有选择照片</div>
    <div id="list" class="file-list" aria-live="polite"></div>
    <div class="action-row"><button id="retry" type="button" hidden>只重试失败照片</button><button id="process" type="button" disabled><span id="process-label">开始处理</span><span id="process-arrow">→</span></button></div>
    <div id="progress" class="progress-track" role="progressbar" aria-label="照片处理进度" hidden><div id="progress-fill"></div></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="downloads" class="download-list" aria-live="polite"></div>
  </main>
</body>
</html>
